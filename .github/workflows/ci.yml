name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the end-to-end tests (real engine, Chrome, Electron)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    needs: check
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --project engine packages/engine/test
      - run: pnpm --filter @kokpit/app test:e2e
